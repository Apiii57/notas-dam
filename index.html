<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas DAM</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      margin: 0;
      padding: 20px;
    }
    .caja {
      max-width: 420px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; color: #2c3e50; }
    .fila {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0;
    }
    input {
      width: 70px;
      padding: 6px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      font-size: 16px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #resultado {
      text-align: center;
      font-size: 22px;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="caja">
    <h1>📚 Notas 1º DAM</h1>

    <!-- Aquí se dibujan los módulos desde JavaScript -->
    <div id="modulos"></div>

    <button onclick="calcularMedia()">Calcular media</button>
    <div id="resultado"></div>
  </div>

  <script>
    // Lista de módulos de 1º DAM
    const modulos = [
      "Programación",
      "Bases de Datos",
      "Sistemas Informáticos",
      "Entornos de Desarrollo",
      "Lenguajes de Marcas",
      "Itinerario Personal (IPE I)"
    ];

    // Crear una fila (nombre + casilla de nota) por cada módulo
    const contenedor = document.getElementById("modulos");
    modulos.forEach(function (nombre, i) {
      contenedor.innerHTML +=
        '<div class="fila">' +
          '<label for="nota' + i + '">' + nombre + '</label>' +
          '<input type="number" id="nota' + i + '" min="0" max="10" step="0.1">' +
        '</div>';
    });

    // Calcula la media de las notas que estén escritas
    function calcularMedia() {
      let suma = 0;
      let cuantas = 0;

      modulos.forEach(function (nombre, i) {
        const valor = document.getElementById("nota" + i).value;
        if (valor !== "") {
          suma += Number(valor);
          cuantas++;
        }
      });

      const resultado = document.getElementById("resultado");
      if (cuantas === 0) {
        resultado.textContent = "Escribe al menos una nota";
        return;
      }

      const media = suma / cuantas;
      resultado.textContent = "Media: " + media.toFixed(2);
    }
  </script>
</body>
</html>
